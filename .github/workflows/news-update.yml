name: Daily football news update

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  update-football:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch & build football_news.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_football.py

      - name: Commit and push if changed
        run: |
          git config user.name "football-bot"
          git config user.email "football-bot@users.noreply.github.com"
          git add football_news.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update football_news.json"
          git push
