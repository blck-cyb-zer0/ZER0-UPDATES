name: Daily memes update

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  update-memes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch & build memes.json
        run: python fetch_memes.py

      - name: Commit and push if changed
        run: |
          git config user.name "memes-bot"
          git config user.email "memes-bot@users.noreply.github.com"
          git add memes.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update memes.json"
          git push
