name: Daily coupons update

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  update-coupons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch & build coupons.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_coupons.py

      - name: Commit and push if changed
        run: |
          git config user.name "coupons-bot"
          git config user.email "coupons-bot@users.noreply.github.com"
          git add coupons.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update coupons.json"
          git push
