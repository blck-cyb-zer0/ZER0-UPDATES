name: Suggest apps

on:
  schedule:
    - cron: "40 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: suggest-apps
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Find suggestions and message the owner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python suggest_apps.py

      - name: Remember what was suggested
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f .suggested_apps.json ] && git add .suggested_apps.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "suggestions: remember sent apps"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
