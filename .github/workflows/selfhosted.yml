name: Import self-hosted list

on:
  schedule:
    - cron: "20 4 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: selfhosted
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pyyaml

      - name: Pull the awesome-selfhosted list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_selfhosted.py

      - name: Build the Self-Hosted page
        run: python build_downloads.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/selfhosted.json assets/selfhosted-LICENSE.txt
          [ -d selfhosted ] && git add selfhosted
          [ -f alias_dirs.txt ] && git add alias_dirs.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update self-hosted directory"
          for i in 1 2 3 4; do
            git reset --hard HEAD
            git pull --rebase origin main && git push && exit 0
            sleep 6
          done
          exit 1
