name: Daily deals update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch & build deals.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_deals.py

      - name: Commit and push if changed
        run: |
          git config user.name "deals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deals.json
          git diff --staged --quiet || git commit -m "Daily deals update: $(date -u +%Y-%m-%d)"
          git push
