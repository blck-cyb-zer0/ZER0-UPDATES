<!DOCTYPE html>
<html>
<head>
    <title>Coupons - ZER0 Updates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #111; color: #eee; padding: 15px; margin: 0; }
        header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        header h1 { flex: 1; font-size: 22px; margin: 0; }
        #menu-btn { background: none; border: none; color: #eee; font-size: 24px; cursor: pointer; padding: 4px 8px; }
        #side-menu { position: fixed; top: 0; left: -260px; width: 240px; height: 100%; background: #1a1a1a; padding: 20px; transition: left 0.25s ease; z-index: 100; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        #side-menu.open { left: 0; }
        #side-menu a { display: block; color: #eee; text-decoration: none; padding: 12px 0; border-bottom: 1px solid #2a2a2a; font-size: 15px; }
        #menu-close { background: none; border: none; color: #888; font-size: 20px; float: right; cursor: pointer; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
        #overlay.open { display: block; }
        .coupon { background: #1c1c1c; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .store { color: #0af; font-size: 13px; text-transform: uppercase; }
        .discount { font-size: 17px; font-weight: bold; margin: 4px 0; color: #0f0; }
        .desc { font-size: 13px; color: #aaa; margin: 4px 0; }
        .code-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .code { background: #222; border: 1px dashed #0af; color: #0af; padding: 6px 12px; border-radius: 6px; font-family: monospace; font-size: 14px; letter-spacing: 1px; }
        .copy-btn { background: #0af; color: #111; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="overlay" onclick="closeMenu()"></div>
    <div id="side-menu">
        <button id="menu-close" onclick="closeMenu()">✕</button>
        <a href="index.html">Deals</a>
        <a href="news.html">News</a>
        <a href="coupons.html">Coupons</a>
        <a href="help.html">Help</a>
        <a href="https://t.me/blck_cyb_0" target="_blank">Contact (Telegram)</a>
        <a href="mailto:hckbos77@gmail.com">Contact (Email)</a>
    </div>

    <header>
        <button id="menu-btn" onclick="openMenu()">☰</button>
        <h1>🏷️ ZER0 Coupons</h1>
    </header>

    <div id="coupons-container">Loading coupons...</div>

    <script>
        function openMenu() {
            document.getElementById('side-menu').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('side-menu').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }

        function copyCode(code, btn) {
            navigator.clipboard.writeText(code).then(() => {
                const old = btn.innerText;
                btn.innerText = 'Copied!';
                setTimeout(() => btn.innerText = old, 1500);
            });
        }

        fetch('coupons.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('coupons-container');
                if (!data.coupons || data.coupons.length === 0) {
                    container.innerHTML = '<p>No active coupon codes right now — check back soon.</p>';
                    return;
                }
                container.innerHTML = data.coupons.map(c => `
                    <div class="coupon">
                        <span class="store">${c.store}</span>
                        <div class="discount">${c.discount}</div>
                        <div class="desc">${c.desc}</div>
                        <div class="code-row">
                            <span class="code">${c.code}</span>
                            <button class="copy-btn" onclick="copyCode('${c.code}', this)">Copy</button>
                            <a href="${c.link}" target="_blank" style="color:#0af; font-size:13px; margin-left:auto;">Visit →</a>
                        </div>
                    </div>
                `).join('');
            })
            .catch(() => {
                document.getElementById('coupons-container').innerText = 'Failed to load coupons.';
            });
    </script>
</body>
</html>
