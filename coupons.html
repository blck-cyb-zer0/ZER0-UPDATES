    <script>
        function openMenu() {
            document.getElementById('side-menu').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('side-menu').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }
        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') !== 'dark') {
            document.body.classList.add('light');
            window.addEventListener('DOMContentLoaded', () => {
                document.getElementById('theme-btn').innerText = '☀️';
            });
        }

        function copyCode(code, btn) {
            navigator.clipboard.writeText(code).then(() => {
                const old = btn.innerText;
                btn.innerText = 'Copied!';
                setTimeout(() => btn.innerText = old, 1500);
            });
        }

        const couponsStartTime = Date.now();
        fetch('coupons.json')
            .then(res => res.json())
            .then(data => {
                const elapsed = Date.now() - couponsStartTime;
                const remaining = Math.max(0, 700 - elapsed);
                setTimeout(() => {
                    const container = document.getElementById('coupons-container');
                    if (!data.coupons || data.coupons.length === 0) {
                        container.innerHTML = '<p>No active coupon codes right now — check back soon.</p>';
                        container.classList.add('fade-in');
                        localStorage.setItem('coupons-last-updated', Date.now());
                        return;
                    }
                    container.innerHTML = data.coupons.map(c => `
                        <div class="coupon">
                            <span class="store">${c.store}</span>
                            <div class="discount">${c.discount}</div>
                            <div class="desc">${c.desc}</div>
                            <div class="code-row">
                                <span class="code">${c.code}</span>
                                <button class="copy-btn" onclick="copyCode('${c.code}', this)">Copy</button>
                                <a href="${c.link}" target="_blank" style="color:#0af; font-size:13px; margin-left:auto;">Visit →</a>
                            </div>
                        </div>
                    `).join('');
                    localStorage.setItem('coupons-last-updated', Date.now());
                    container.classList.add('fade-in');
                }, remaining);
            })
            .catch(() => {
                const container = document.getElementById('coupons-container');
                if (!navigator.onLine) {
                    container.innerHTML = '<div style="text-align:center; padding:30px 15px;"><div style="font-size:40px;">📡</div><p style="margin-top:10px;">You\'re offline. Check your connection and try again.</p><button onclick="location.reload()" style="margin-top:12px; padding:8px 20px; background:#1e3cc8; color:#fff; border:none; border-radius:6px; cursor:pointer;">Retry</button></div>';
                } else {
                    container.innerText = 'Failed to load coupons.';
                }
            });
    </script>
