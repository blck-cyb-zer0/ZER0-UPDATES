        .glitch-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fc;
            z-index: 999999;
            overflow: hidden;
        }
        .glitch-ring {
            width: 100vmax;
            height: 100vmax;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .glitch-ring::before,
        .glitch-ring::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(30, 60, 200, 0.15);
            animation: ring-pulse 8s ease-out infinite;
        }
        .glitch-ring::before {
            width: 100%;
            height: 100%;
        }
        .glitch-ring::after {
            width: 100%;
            height: 100%;
            animation-delay: 1s;
        }
        @keyframes ring-pulse {
            0% { transform: scale(0); opacity: 0.9; }
            100% { transform: scale(1); opacity: 0; }
        }
        .glitch-0 {
            font-size: 330px;
            font-weight: bold;
            font-family: monospace;
            color: #0a1a3f;
            position: absolute;
            display: inline-block;
            z-index: 2;
        }
        .glitch-0::before,
        .glitch-0::after {
            content: 'O';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }
        .glitch-0::before {
            color: #1e3cc8;
            animation: glitch-anim-1 8s infinite;
        }
        .glitch-0::after {
            color: #000;
            animation: glitch-anim-2 8s infinite;
        }
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(10% 0 70% 0); transform: translate(-4px, -2px); opacity: 0.8; }
            4% { clip-path: inset(50% 0 15% 0); transform: translate(4px, 2px); opacity: 0.9; }
            8% { clip-path: inset(75% 0 5% 0); transform: translate(-3px, 1px); opacity: 0.7; }
            12% { clip-path: inset(20% 0 55% 0); transform: translate(3px, -2px); opacity: 0.9; }
            16% { clip-path: inset(5% 0 85% 0); transform: translate(-4px, 1px); opacity: 0.8; }
            20% { clip-path: inset(0 0 0 0); transform: translate(0, 0); opacity: 1; }
            100% { clip-path: inset(0 0 0 0); transform: translate(0, 0); opacity: 1; }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(60% 0 10% 0); transform: translate(4px, 2px); opacity: 0.8; }
            4% { clip-path: inset(15% 0 65% 0); transform: translate(-4px, -1px); opacity: 0.9; }

    <div id="memes-container" class="meme-grid"><div class="glitch-loader"><div class="glitch-ring"><div class="glitch-0">O</div></div></div></div>

    <script>
        function openMenu() {
            document.getElementById('side-menu').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('side-menu').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }

        const memesStartTime = Date.now();
        fetch('memes.json')
            .then(res => res.json())
            .then(data => {
                const elapsed = Date.now() - memesStartTime;
                const remaining = Math.max(0, 700 - elapsed);
                setTimeout(() => {
                    document.getElementById('memes-container').innerHTML = data.memes.map(m => `
                        <div class="meme-card">
                            <img src="${m.image}" alt="meme">
                            <div class="meme-caption">${m.caption}</div>
                        </div>
                    `).join('');
                    document.getElementById('memes-container').classList.add('fade-in');
                }, remaining);
            })
            .catch(() => {
                document.getElementById('memes-container').innerText = 'Failed to load memes.';
            });
            });
    </script>
