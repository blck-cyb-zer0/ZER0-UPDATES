<!DOCTYPE html>
<html>
<head>
    <title>News - ZER0 Updates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #111; color: #eee; padding: 15px; margin: 0; }
        header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        header h1 { flex: 1; font-size: 22px; margin: 0; }
        #menu-btn { background: none; border: none; color: #eee; font-size: 24px; cursor: pointer; padding: 4px 8px; }
        #side-menu { position: fixed; top: 0; left: -260px; width: 240px; height: 100%; background: #1a1a1a; padding: 20px; transition: left 0.25s ease; z-index: 100; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        #side-menu.open { left: 0; }
        #side-menu a { display: block; color: #eee; text-decoration: none; padding: 12px 0; border-bottom: 1px solid #2a2a2a; font-size: 15px; }
        #menu-close { background: none; border: none; color: #888; font-size: 20px; float: right; cursor: pointer; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
        #overlay.open { display: block; }
        .article { background: #1c1c1c; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; gap: 12px; }
        .article img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; background: #333; flex-shrink: 0; }
        .cat { color: #0af; font-size: 12px; text-transform: uppercase; }
        .title { font-size: 16px; font-weight: bold; margin: 4px 0; }
        .summary { font-size: 13px; color: #aaa; margin: 4px 0; }
        .read-btn { display: inline-block; margin-top: 6px; color: #0af; text-decoration: none; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="overlay" onclick="closeMenu()"></div>
    <div id="side-menu">
        <button id="menu-close" onclick="closeMenu()">✕</button>
        <a href="index.html">Deals</a>
        <a href="news.html">News</a>
        <a href="coupons.html">Coupons</a>
        <a href="help.html">Help</a>
        <a href="https://t.me/blck_cyb_0" target="_blank">Contact (Telegram)</a>
        <a href="mailto:hckbos77@gmail.com">Contact (Email)</a>
    </div>

    <header>
        <button id="menu-btn" onclick="openMenu()">☰</button>
        <h1>📰 ZER0 News</h1>
    </header>

    <div id="news-container">Loading news...</div>

    <script>
        function openMenu() {
            document.getElementById('side-menu').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('side-menu').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }

        fetch('news.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('news-container');
                container.innerHTML = data.articles.map(a => `
                    <div class="article">
                        <img src="${a.image || 'https://via.placeholder.com/70'}" alt="${a.title}">
                        <div>
                            <span class="cat">${a.cat}</span>
                            <div class="title">${a.title}</div>
                            <div class="summary">${a.summary}</div>
                            <a class="read-btn" href="${a.link}" target="_blank">Read more →</a>
                        </div>
                    </div>
                `).join('');
            })
            .catch(() => {
                document.getElementById('news-container').innerText = 'Failed to load news.';
            });
    </script>
</body>
</html>
