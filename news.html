        .glitch-loader {
            position: fixed;
            top: 0;
            left: 0;

        .glitch-ring {

            height: 100vmax;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .glitch-ring::before,
        .glitch-ring::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(30, 60, 200, 0.15);
            animation: ring-pulse 8s ease-out infinite;
        }
        .glitch-ring::before {
            width: 100%;
            height: 100%;
        }
        .glitch-ring::after {
            width: 100%;
            height: 100%;
            animation-delay: 1s;
        }
        @keyframes ring-pulse {
            0% { transform: scale(0); opacity: 0.9; }
            100% { transform: scale(1); opacity: 0; }
        }
        .glitch-0 {
            font-size: 330px;
            font-weight: bold;
            font-family: monospace;

            position: absolute;

            z-index: 2;

        .glitch-0::before,
        .glitch-0::after {
            content: 'O';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

        .glitch-0::before {
            color: #1e3cc8;

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') !== 'dark') {
            document.body.classList.add('light');
            window.addEventListener('DOMContentLoaded', () => {
                document.getElementById('theme-btn').innerText = '☀️';
            });
        }
        function openMenu() {
            document.getElementById('side-menu').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('side-menu').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }
        function loadNews() {
            const newsPageStartTime = Date.now();
            fetch('news.json')
                .then(res => res.json())
                .then(data => {
                    const elapsed = Date.now() - newsPageStartTime;
                    const remaining = Math.max(0, 700 - elapsed);
                    setTimeout(() => {
                        const container = document.getElementById('news-container');
                        container.innerHTML = data.articles.map(a => `
                            <div class="article">
                                <img src="${a.image || 'https://via.placeholder.com/70'}" alt="${a.title}">
                                <div>
                                    <span class="cat">${a.cat}</span>
                                    <div class="title">${a.title}</div>
                                    <div class="summary">${a.summary}</div>
                                    <a class="read-btn" href="${a.link}" target="_blank">Read more →</a>
                                </div>
                            </div>
                        `).join('');
                        container.classList.add('fade-in');
                        localStorage.setItem('news-last-updated', Date.now());
                        endPullRefresh();
                    }, remaining);
                })
                .catch(() => {
                    const container = document.getElementById('news-container');
                    if (!navigator.onLine) {
                        container.innerHTML = '<div style="text-align:center; padding:30px 15px;"><div style="font-size:40px;">📡</div><p style="margin-top:10px;">You\'re offline. Check your connection and try again.</p><button onclick="location.reload()" style="margin-top:12px; padding:8px 20px; background:#1e3cc8; color:#fff; border:none; border-radius:6px; cursor:pointer;">Retry</button></div>';
                    } else {
                        container.innerText = 'Failed to load news.';
                    }
                    endPullRefresh();
                });
        }
        loadNews();

        let pullStartY = 0;
        let pulling = false;
        const pullIndicator = document.getElementById('pull-refresh-indicator');
        document.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0) {
                pullStartY = e.touches[0].clientY;
                pulling = true;
            }
        });
        document.addEventListener('touchmove', (e) => {
            if (!pulling) return;
            const diff = e.touches[0].clientY - pullStartY;
            if (diff > 60) {
                pullIndicator.classList.add('active');
            }
        });
        document.addEventListener('touchend', () => {
            if (pulling && pullIndicator.classList.contains('active')) {
                pullIndicator.classList.add('refreshing');
                loadNews();
            }
            pulling = false;
        });
        function endPullRefresh() {
            pullIndicator.classList.remove('active', 'refreshing');
        }
    </script>
