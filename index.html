<!DOCTYPE html>
<html>
<head>
    <title>Zer0 Deals</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
        .deal { background: #1c1c1c; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .cat { color: #0af; font-size: 12px; text-transform: uppercase; }
        .title { font-size: 18px; font-weight: bold; margin: 5px 0; }
        .price { color: #0f0; font-size: 20px; }
        .was { text-decoration: line-through; color: #888; margin-left: 10px; }
        .hot { background: #f33; color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🔥 Zer0 Deals</h1>
    <div id="deals-container">Loading deals...</div>

    <script>
        fetch('deals.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('deals-container');
                container.innerHTML = '';

                data.deals.forEach(deal => {
                    const div = document.createElement('div');
                    div.className = 'deal';
                    div.innerHTML = `
                        <span class="cat">${deal.cat}</span>
                        ${deal.hot ? '<span class="hot">HOT</span>' : ''}
                        <div class="title">${deal.title}</div>
                        <p>${deal.desc}</p>
                        <span class="price">$${deal.now}</span>
                        <span class="was">$${deal.was}</span>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(err => {
                document.getElementById('deals-container').innerText = 'Failed to load deals.';
            });
    </script>
</body>
</html>
