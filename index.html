<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZER0 UPDATES // DIRECT ARCHIVE</title>
  <meta name="description" content="ZER0 UPDATES: a direct download archive of tools, experiments and media.">
  <meta name="theme-color" content="#050508">
  <meta property="og:title" content="ZER0 UPDATES // DIRECT ARCHIVE">
  <meta property="og:description" content="A direct download archive of tools, experiments and media.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
  <noscript><style>#boot-screen{display:none}</style></noscript>
  <style>
    :root {
      --bg: #050508;
      --panel: #0c0d14;
      --border: #1f2233;
      --cyan: #00f3ff;
      --magenta: #ff0055;
      --green: #00ff66;
      --text: #e2e8f0;
      --muted: #7a859e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* CRT scanline overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.25) 0px,
        rgba(0, 0, 0, 0.25) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 9998;
    }

    /* Boot screen */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    #boot-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-text {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--cyan);
      text-shadow: 2px 0 var(--magenta), -2px 0 var(--green);
      text-align: center;
      padding: 0 16px;
      animation: glitch-skew 0.3s infinite linear alternate-reverse;
    }

    .boot-bar {
      width: 220px;
      max-width: 70vw;
      height: 4px;
      background: var(--border);
      margin-top: 14px;
      overflow: hidden;
      position: relative;
    }

    .boot-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--magenta), var(--cyan));
      animation: load-sweep 0.9s ease-out forwards;
    }

    /* Layout: flex column so the ad slot can load last in the code
       but still show near the top of the page */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 60px;
      display: flex;
      flex-direction: column;
    }

    .container > * { min-width: 0; }

    header {
      order: 0;
      text-align: center;
      padding: 24px 0 18px;
      border-bottom: 1px solid var(--border);
    }

    .ad-slot-top { order: 1; }
    .controls    { order: 2; }
    .grid        { order: 3; }

    .glitch-title {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      position: relative;
      display: inline-block;
      text-transform: uppercase;
      animation: glitch-jitter 3s infinite;
    }

    .glitch-title::before,
    .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .glitch-title::before {
      left: 2px;
      text-shadow: -2px 0 var(--magenta);
      clip-path: inset(15% 0 60% 0);
      animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }

    .glitch-title::after {
      left: -2px;
      text-shadow: -2px 0 var(--cyan);
      clip-path: inset(55% 0 10% 0);
      animation: glitch-anim-2 1.7s infinite linear alternate-reverse;
    }

    .subtitle {
      color: var(--cyan);
      font-size: 0.85rem;
      margin-top: 8px;
      letter-spacing: 1.5px;
    }

    /* Banner ad slot */
    .ad-slot-top {
      margin: 18px auto;
      padding: 8px;
      min-height: 66px;
      background: var(--panel);
      border: 1px dashed var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
      max-width: 100%;
    }

    /* Search and filters */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    .search-box {
      flex: 1 1 260px;
      background: var(--panel);
      border: 1px solid var(--cyan);
      color: var(--text);
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      border-radius: 0;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
    }

    .search-box:focus {
      border-color: var(--magenta);
      box-shadow: 0 0 14px rgba(255, 0, 85, 0.25);
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      border-radius: 0;
      transition: 0.15s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      text-shadow: 0 0 6px rgba(0, 243, 255, 0.5);
    }

    /* Grid and cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .card:hover,
    .card:active {
      border-color: var(--magenta);
      transform: translate(-1px, -2px);
      box-shadow: 3px 3px 0 var(--cyan);
    }

    .card-ad { border-style: dashed; }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      margin-bottom: 10px;
    }

    .badge-cat {
      background: rgba(0, 243, 255, 0.12);
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 2px 7px;
      font-weight: bold;
    }

    .badge-ad {
      background: rgba(255, 0, 85, 0.12);
      color: var(--magenta);
      border-color: var(--magenta);
    }

    .badge-tag { color: var(--green); }

    .card-title {
      font-size: 1.15rem;
      color: #fff;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .card-desc {
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 18px;
      flex-grow: 1;
    }

    /* Download button */
    .dl-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background: transparent;
      border: 1px solid var(--magenta);
      color: #fff;
      padding: 11px 14px;
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 1.5px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .dl-btn:hover {
      background: var(--magenta);
      color: #050508;
      box-shadow: -3px 0 var(--cyan), 3px 0 var(--green);
    }

    .dl-btn.tapped {
      animation: tap-glitch 0.28s steps(2, end);
      background: var(--cyan);
      color: #050508;
      border-color: var(--cyan);
    }

    .dl-off {
      border-color: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }

    .dl-off:hover {
      background: transparent;
      color: var(--muted);
      box-shadow: none;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      border: 1px dashed var(--border);
      color: var(--muted);
    }

    /* Keyframes */
    @keyframes load-sweep {
      from { transform: translateX(-100%); }
      to   { transform: translateX(0%); }
    }

    @keyframes glitch-skew {
      0%   { transform: skew(0deg); }
      25%  { transform: skew(4deg); }
      50%  { transform: skew(-3deg); }
      75%  { transform: skew(2deg); }
      100% { transform: skew(0deg); }
    }

    @keyframes glitch-jitter {
      0%, 92%, 100% { transform: translate(0, 0); }
      94% { transform: translate(-3px, 1px); }
      96% { transform: translate(3px, -1px); }
      98% { transform: translate(-1px, 0); }
    }

    @keyframes glitch-anim-1 {
      0%   { clip-path: inset(10% 0 75% 0); }
      50%  { clip-path: inset(45% 0 25% 0); }
      100% { clip-path: inset(70% 0 5% 0); }
    }

    @keyframes glitch-anim-2 {
      0%   { clip-path: inset(65% 0 10% 0); }
      50%  { clip-path: inset(20% 0 55% 0); }
      100% { clip-path: inset(5% 0 80% 0); }
    }

    @keyframes tap-glitch {
      0%   { transform: translate(0, 0) skew(0deg); }
      25%  { transform: translate(-4px, 2px) skew(6deg); }
      50%  { transform: translate(4px, -2px) skew(-6deg); }
      75%  { transform: translate(-2px, -1px) skew(3deg); }
      100% { transform: translate(0, 0) skew(0deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
  <script>
    /* Failsafe: the boot screen always clears, even if an ad script is slow */
    setTimeout(function () {
      var b = document.getElementById('boot-screen');
      if (b) b.classList.add('hidden');
    }, 3500);
  </script>
</head>
<body>

  <div id="boot-screen" aria-hidden="true">
    <div class="boot-text">[ INITIALIZING ZER0_NODE... ]</div>
    <div class="boot-bar"></div>
  </div>

  <div class="container">

    <header>
      <h1 class="glitch-title" data-text="ZER0 UPDATES">ZER0 UPDATES</h1>
      <p class="subtitle">// DIRECT CLOUD ARCHIVE &bull; ZERO REDIRECTS //</p>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" class="search-box" aria-label="Search the archive" placeholder="> SEARCH ARCHIVE (TOOLS, APKS, SCRIPTS)..." autocomplete="off">
      <div class="filter-bar" id="filterBar">
        <button type="button" class="filter-btn active" data-cat="ALL">ALL</button>
      </div>
    </div>

    <main class="grid" id="catalogGrid">
      <div class="empty-state">DECRYPTING CATALOG MANIFEST...</div>
      <noscript><div class="empty-state">[ JAVASCRIPT IS REQUIRED TO VIEW THE ARCHIVE ]</div></noscript>
    </main>

    <!-- App script runs BEFORE the ad scripts, so a slow ad server can never block the catalog -->
    <script>
    (function () {
      'use strict';

      var SMART_LINK = 'https://araplhn.org/4/f81a84b09910239924f1f24c0f2e9789';
      var AD_POSITION = 3;
      var LABEL = '[ DIRECT DOWNLOAD ]';
      var PREFERRED_ORDER = ['TOOLS', 'EXPERIMENTS', 'MEDIA'];

      var grid = document.getElementById('catalogGrid');
      var searchInput = document.getElementById('searchInput');
      var filterBar = document.getElementById('filterBar');

      var allItems = [];
      var currentCategory = 'ALL';

      function hideBoot() {
        var b = document.getElementById('boot-screen');
        if (b) b.classList.add('hidden');
      }
      setTimeout(hideBoot, 650);

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function safeUrl(u) {
        try {
          var url = new URL(String(u || ''), location.href);
          if (url.protocol === 'http:' || url.protocol === 'https:') return url;
        } catch (e) {}
        return null;
      }

      function normalize(raw) {
        raw = raw || {};
        return {
          title: String(raw.title || 'Untitled'),
          description: String(raw.description || 'Direct cloud-mirrored package.'),
          category: String(raw.category || 'FILE').toUpperCase(),
          tag: String(raw.tag || 'DIRECT'),
          url: safeUrl(raw.url)
        };
      }

      function renderFilters() {
        var present = [];
        allItems.forEach(function (it) {
          if (present.indexOf(it.category) === -1) present.push(it.category);
        });
        var cats = PREFERRED_ORDER.filter(function (c) { return present.indexOf(c) !== -1; })
          .concat(present.filter(function (c) { return PREFERRED_ORDER.indexOf(c) === -1; }));

        if (currentCategory !== 'ALL' && cats.indexOf(currentCategory) === -1) currentCategory = 'ALL';

        filterBar.innerHTML = ['ALL'].concat(cats).map(function (c) {
          return '<button type="button" class="filter-btn' + (c === currentCategory ? ' active' : '') +
                 '" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>';
        }).join('');
      }

      function cardHtml(item) {
        var btn;
        if (item.url) {
          var sameOrigin = item.url.origin === location.origin;
          btn = '<a href="' + escapeHtml(item.url.href) + '" class="dl-btn"' +
                (sameOrigin ? ' download' : ' target="_blank" rel="noopener"') + '>' + LABEL + '</a>';
        } else {
          btn = '<span class="dl-btn dl-off">[ LINK UNAVAILABLE ]</span>';
        }
        return '<article class="card"><div>' +
          '<div class="card-meta"><span class="badge-cat">' + escapeHtml(item.category) + '</span>' +
          '<span class="badge-tag">' + escapeHtml(item.tag) + '</span></div>' +
          '<h2 class="card-title">' + escapeHtml(item.title) + '</h2>' +
          '<p class="card-desc">' + escapeHtml(item.description) + '</p>' +
          '</div>' + btn + '</article>';
      }

      function adCardHtml() {
        return '<article class="card card-ad"><div>' +
          '<div class="card-meta"><span class="badge-cat badge-ad">SPONSORED</span><span class="badge-tag">AD</span></div>' +
          '<h2 class="card-title">Sponsored offer</h2>' +
          '<p class="card-desc">This is a paid advertisement. It opens in a new tab.</p>' +
          '</div>' +
          '<a href="' + escapeHtml(SMART_LINK) + '" class="dl-btn dl-ad" target="_blank" rel="noopener noreferrer sponsored nofollow">[ OPEN OFFER ]</a>' +
          '</article>';
      }

      function renderItems() {
        if (!allItems.length) {
          grid.innerHTML = '<div class="empty-state">[ CATALOG IS EMPTY ]</div>';
          return;
        }

        var query = searchInput.value.toLowerCase().trim();

        var filtered = allItems.filter(function (it) {
          var matchesCat = currentCategory === 'ALL' || it.category === currentCategory;
          var matchesQuery = !query ||
            it.title.toLowerCase().indexOf(query) !== -1 ||
            it.description.toLowerCase().indexOf(query) !== -1 ||
            it.tag.toLowerCase().indexOf(query) !== -1 ||
            it.category.toLowerCase().indexOf(query) !== -1;
          return matchesCat && matchesQuery;
        });

        if (!filtered.length) {
          grid.innerHTML = '<div class="empty-state">[ 0 MATCHES FOUND IN NODE ]</div>';
          return;
        }

        var cards = filtered.map(cardHtml);
        if (!query) cards.splice(Math.min(AD_POSITION, cards.length), 0, adCardHtml());
        grid.innerHTML = cards.join('');
      }

      async function loadCatalog() {
        grid.innerHTML = '<div class="empty-state">DECRYPTING CATALOG MANIFEST...</div>';
        try {
          var res = await fetch('./catalog.json?v=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var data = await res.json();
          var list = Array.isArray(data) ? data : (data && Array.isArray(data.items) ? data.items : []);
          allItems = list.map(normalize);
          renderFilters();
          renderItems();
        } catch (err) {
          grid.innerHTML = '<div class="empty-state">[ ERROR: UNABLE TO LOAD CATALOG.JSON ]<br><br>' +
            '<button type="button" class="filter-btn" data-retry="1">RETRY</button></div>';
        }
      }

      searchInput.addEventListener('input', renderItems);

      filterBar.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('.filter-btn') : null;
        if (!btn) return;
        currentCategory = btn.getAttribute('data-cat') || 'ALL';
        var all = filterBar.querySelectorAll('.filter-btn');
        for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
        btn.classList.add('active');
        renderItems();
      });

      grid.addEventListener('click', function (e) {
        var retry = e.target.closest ? e.target.closest('[data-retry]') : null;
        if (retry) { loadCatalog(); return; }

        var el = e.target.closest ? e.target.closest('a.dl-btn') : null;
        if (!el || el.classList.contains('dl-ad')) return;
        el.classList.remove('tapped');
        void el.offsetWidth;
        el.classList.add('tapped');
        el.textContent = '[ INITIATING TRANSFER... ]';
        setTimeout(function () {
          el.textContent = LABEL;
          el.classList.remove('tapped');
        }, 1500);
      });

      loadCatalog();
    })();
    </script>

    <!-- AD 1 + 5: banner. 728x90 on tablets/desktop, 320x50 on phones. Shown at the top via CSS order. -->
    <div class="ad-slot-top" id="adTop">
      <script>
        (function () {
          var wide = window.innerWidth >= 760;
          var cfg = wide
            ? { key: '38d724d5189016770fdbc1d90e673a86', height: 90, width: 728 }
            : { key: 'de8bbb25b7e34e2e7d6ac369d3febafe', height: 50, width: 320 };
          window.atOptions = { key: cfg.key, format: 'iframe', height: cfg.height, width: cfg.width, params: {} };
          document.write('<scr' + 'ipt src="https://bauval.org/22/' + cfg.key + '"></scr' + 'ipt>');
        })();
      </script>
    </div>

  </div>

  <!-- AD 2 + 3: page-level scripts, loaded last -->
  <script data-cfasync="false" src="https://bauval.org/14/40caa574cd409f780dd59da361065949"></script>
  <script data-cfasync="false" src="https://abscloud.org/1/e1fce6f1d4f159a7629b4d41ab4f3471"></script>

  <!-- AD 4 (Smart Link) is the SPONSORED card in the catalog grid (see SMART_LINK in the script above) -->

</body>
</html>
