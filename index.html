<!DOCTYPE html>
<html>
<head>
    <title>ZER0 Deals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #111; color: #eee; padding: 15px; margin: 0; }
        header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        header h1 { flex: 1; }
        h1 { font-size: 22px; margin: 0; }
        nav a { color: #0af; text-decoration: none; font-size: 14px; }
        #search { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: none; background: #222; color: #eee; }
        #filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .filter-btn { background: #222; color: #ccc; border: 1px solid #333; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
        .filter-btn.active { background: #0af; color: #111; border-color: #0af; }
        .deal { background: #1c1c1c; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; gap: 12px; }
        .deal img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; background: #333; flex-shrink: 0; }
        .deal-info { flex: 1; }
        .cat { color: #0af; font-size: 12px; text-transform: uppercase; }
        .title { font-size: 16px; font-weight: bold; margin: 4px 0; color: #eee; }
        .desc { font-size: 13px; color: #aaa; margin: 4px 0; }
        .price { color: #0f0; font-size: 18px; }
        .was { text-decoration: line-through; color: #888; margin-left: 8px; font-size: 13px; }
        .hot { background: #f33; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
        .buy-btn { display: inline-block; margin-top: 8px; background: #0af; color: #111; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; }
        .source-link { display: inline-block; margin-top: 8px; margin-left: 8px; color: #888; text-decoration: none; font-size: 12px; }
        .promo-card { background: linear-gradient(135deg, #0af, #0066cc); border-radius: 10px; padding: 18px; margin-bottom: 15px; }
        .promo-card .promo-label { color: #cceeff; font-size: 12px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .promo-card .promo-title { color: #fff; font-size: 19px; font-weight: bold; margin: 6px 0; }
        .promo-card .promo-desc { color: #eaf6ff; font-size: 13px; margin-bottom: 10px; }
        .promo-card .promo-btn { display: inline-block; background: #fff; color: #0066cc; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; }

        #menu-btn { background: none; border: none; color: #eee; font-size: 24px; cursor: pointer; padding: 4px 8px; }
        #theme-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px; }

        body.light { background: #f5f5f5; color: #111; }
        body.light .deal { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        body.light #search { background: #eee; color: #111; }
        body.light .filter-btn { background: #eee; color: #333; border-color: #ddd; }
        body.light #side-menu { background: #fff; box-shadow: 2px 0 10px rgba(0,0,0,0.15); }
        body.light #side-menu a { color: #111; border-bottom-color: #eee; }
        body.light .desc { color: #555; }
        body.light .was { color: #999; }
        body.light #menu-btn, body.light #menu-close { color: #111; }
        body.light .price { color: #0a0; }
        body.light .title, body.light h1 { color: #111; }

        #side-menu { position: fixed; top: 0; left: -260px; width: 240px; height: 100%; background: #1a1a1a; padding: 20px; transition: left 0.25s ease; z-index: 100; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        #side-menu.open { left: 0; }
        #side-menu a { display: block; color: #eee; text-decoration: none; padding: 12px 0; border-bottom: 1px solid #2a2a2a; font-size: 15px; }
        #side-menu a:hover { color: #0af; }
        #menu-close { background: none; border: none; color: #888; font-size: 20px; float: right; cursor: pointer; }

        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
        #overlay.open { display: block; }
    </style>
</head>
<body>
    <div id="overlay" onclick="closeMenu()"></div>
    <div id="side-menu">
        <button id="menu-close" onclick="closeMenu()">✕</button>
        <a href="index.html">Home</a>
        <a href="news.html">News</a>
        <a href="coupons.html">Coupons</a>
        <a href="help.html">Help</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="https://t.me/blck_cyb_0" target="_blank">Contact (Telegram)</a>
        <a href="mailto:hckbos77@gmail.com">Contact (Email)</a>
    </div>

    <header>
        <button id="menu-btn" onclick="openMenu()">☰</button>
        <h1>🔥 ZER0 Deals</h1>
        <button id="theme-btn" onclick="toggleTheme()">🌙</button>
    </header>
    <div class="promo-card">
        <div class="promo-label">Sponsored <span class="hot">HOT</span></div>
        <div class="promo-title">📶 ZER0 Store</div>
        <div class="promo-desc">Fastest data delivery service in Ghana at the cheapest prices, check it out now!!</div>
        <a class="promo-btn" href="https://databosshub.org/shop/zer0-store-60798" target="_blank">Visit Store</a>
    </div>

    <input type="text" id="search" placeholder="Search deals...">
    <div id="filters"></div>
    <div id="deals-container">Loading deals...</div>
    <script>
        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
            window.addEventListener('DOMContentLoaded', () => {
                document.getElementById('theme-btn').innerText = '☀️';
            });
        }

        function openMenu() {
            document.getElementById('side-menu').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('side-menu').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }

        let allDeals = [];
        fetch('deals.json')
            .then(res => res.json())
            .then(data => {
                allDeals = data.deals;
                buildFilters(allDeals);
                renderDeals(allDeals);
            })
            .catch(() => {
                document.getElementById('deals-container').innerText = 'Failed to load deals.';
            });
        function buildFilters(deals) {
            const cats = ['All', ...new Set(deals.map(d => d.cat))];
            const filterDiv = document.getElementById('filters');
            filterDiv.innerHTML = cats.map(c =>
                `<button class="filter-btn ${c === 'All' ? 'active' : ''}" data-cat="${c}">${c}</button>`
            ).join('');
            filterDiv.querySelectorAll('.filter-btn').forEach(btn => {
                btn.onclick = () => {
                    filterDiv.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    applyFilters();
                };
            });
        }
        function applyFilters() {
            const activeCat = document.querySelector('.filter-btn.active').dataset.cat;
            const search = document.getElementById('search').value.toLowerCase();
            let filtered = allDeals;
            if (activeCat !== 'All') filtered = filtered.filter(d => d.cat === activeCat);
            if (search) filtered = filtered.filter(d =>
                d.title.toLowerCase().includes(search) || d.desc.toLowerCase().includes(search)
            );
            renderDeals(filtered);
        }
        document.getElementById('search').addEventListener('input', applyFilters);
        function renderDeals(deals) {
            const container = document.getElementById('deals-container');
            if (deals.length === 0) {
                container.innerHTML = '<p>No deals match your search.</p>';
                return;
            }
            container.innerHTML = deals.map(deal => `
                <div class="deal">
                    <img src="${deal.image || 'https://via.placeholder.com/70'}" alt="${deal.title}">
                    <div class="deal-info">
                        <span class="cat">${deal.cat}</span>
                        ${deal.hot ? '<span class="hot">HOT</span>' : ''}
                        <div class="title">${deal.title}</div>
                        <div class="desc">${deal.desc}</div>
                        <div>
                            <span class="price">$${deal.now}</span>
                            <span class="was">$${deal.was}</span>
                        </div>
                        ${deal.link ? `<a class="buy-btn" href="${deal.link}" target="_blank">Buy Now</a>` : ''}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
