    <script>

        // ===== ZER0 BOOT SEQUENCE =====
        (function () {
            const boot = document.getElementById('zer0-boot');
            const bar = document.getElementById('zer0-boot-progress');
            const text = document.getElementById('zer0-boot-text');
            let progress = 0;
            let finished = false;

            const messages = [
                'INITIALIZING ZER0 NETWORK...',
                'LOADING SPORTS FEED...',
                'SYNCING LIVE UPDATES...',
                'DECRYPTING HEADLINES...',
                'ZER0 SYSTEM READY.'
            ];

            const timer = setInterval(() => {
                if (finished) return;
                progress = Math.min(progress + Math.random() * 13 + 5, 92);
                bar.style.width = progress + '%';
                text.textContent = messages[Math.min(4, Math.floor(progress / 20))];
            }, 110);

            function finishBoot() {
                if (finished) return;
                finished = true;
                clearInterval(timer);
                bar.style.width = '100%';
                text.textContent = 'ZER0 SYSTEM READY.';
                setTimeout(() => {
                    boot.classList.add('boot-done');
                    document.documentElement.classList.remove('booting');
                    setTimeout(() => boot.remove(), 500);
                }, 180);
            }

            // The page may finish before the news JSON; don't make visitors wait
            // unnecessarily. Give the boot animation a short minimum presence.
            const minBoot = new Promise(resolve => setTimeout(resolve, 650));
            const pageReady = new Promise(resolve => {
                if (document.readyState === 'complete') resolve();
                else window.addEventListener('load', resolve, { once: true });
            });

            Promise.all([minBoot, pageReady]).then(finishBoot);

            // Safety fallback if a resource hangs indefinitely.
            setTimeout(finishBoot, 4500);
        })();

            document.getElementById('overlay').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('side-menu').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }
        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') !== 'dark') {
            document.body.classList.add('light');
            window.addEventListener('DOMContentLoaded', () => {
                document.getElementById('theme-btn').innerText = '☀️';
            });
        }

        const newsStartTime = Date.now();
        fetch('football_news.json')
            .then(res => res.json())
            .then(data => {
                const elapsed = Date.now() - newsStartTime;
                const remaining = Math.max(0, 700 - elapsed);
                setTimeout(() => {
                    document.getElementById('news-container').innerHTML = data.articles.map(a => `
                        <div class="article">
                            <img src="${a.image || 'https://via.placeholder.com/65'}" alt="${a.title}">
                            <div>
                                <div class="a-title">${a.title}</div>
                                <div class="a-summary">${a.summary}</div>
                                <a class="a-link" href="${a.link}" target="_blank">Read more →</a>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('news-container').classList.add('fade-in');
                    localStorage.setItem('index-last-updated', Date.now());
                }, remaining);
            })
            .catch(() => {
                document.getElementById('news-container').innerText = 'Failed to load news.';
            });
    </script>
