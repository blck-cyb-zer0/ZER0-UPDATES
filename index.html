<!DOCTYPE html>
<html>
<head>
    <title>ZER0 Football</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #111; color: #eee; padding: 15px; margin: 0; }
        header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        header h1 { flex: 1; }
        h1 { font-size: 22px; margin: 0; }
        #menu-btn, #theme-btn { background: none; border: none; color: #eee; font-size: 22px; cursor: pointer; padding: 4px 8px; }

        .tabs { display: flex; gap: 6px; margin-bottom: 15px; overflow-x: auto; }
        .tab-btn { background: #222; color: #ccc; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #0af; color: #111; border-color: #0af; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .match { background: #1c1c1c; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
        .match .comp { color: #0af; font-size: 11px; text-transform: uppercase; margin-bottom: 8px; }
        .match .teams { display: flex; align-items: center; justify-content: space-between; }
        .match .team { display: flex; align-items: center; gap: 8px; flex: 1; }
        .match .team img { width: 24px; height: 24px; object-fit: contain; }
        .match .team span { font-size: 14px; }
        .match .score { font-size: 18px; font-weight: bold; color: #0f0; padding: 0 10px; }
        .match .status { font-size: 11px; color: #888; text-align: center; margin-top: 6px; }
        .match .status.live { color: #f33; font-weight: bold; }

        .article { background: #1c1c1c; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; gap: 12px; }
        .article img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; background: #333; flex-shrink: 0; }
        .article-info { flex: 1; }
        .cat { color: #0af; font-size: 12px; text-transform: uppercase; }
        .title { font-size: 15px; font-weight: bold; margin: 4px 0; color: #eee; }
        .desc { font-size: 13px; color: #aaa; margin: 4px 0; }
        .read-link { display: inline-block; margin-top: 6px; color: #0af; text-decoration: none; font-size: 13px; font-weight: bold; }

        .meme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .meme-card { background: #1c1c1c; border-radius: 8px; overflow: hidden; }
        .meme-card img { width: 100%; height: 140px; object-fit: cover; display: block; }
        .meme-card .meme-title { font-size: 12px; padding: 8px; color: #ccc; }
        .meme-card .meme-source { font-size: 10px; color: #666; padding: 0 8px 8px; }

        body.light { background: #f5f5f5; color: #111; }
        body.light .match, body.light .article, body.light .meme-card { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        body.light .tab-btn { background: #eee; color: #333; border-color: #ddd; }
        body.light #side-menu { background: #fff; box-shadow: 2px 0 10px rgba(0,0,0,0.15); }
        body.light #side-menu a { color: #111; border-bottom-color: #eee; }
        body.light .desc { color: #555; }
        body.light #menu-btn, body.light #theme-btn, body.light #menu-close { color: #111; }
        body.light .title, body.light h1 { color: #111; }

        #side-menu { position: fixed; top: 0; left: -260px; width: 240px; height: 100%; background: #1a1a1a; padding: 20px; transition: left 0.25s ease; z-index: 100; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        #side-menu.open { left: 0; }
        #side-menu a { display: block; color: #eee; text-decoration: none; padding: 12px 0; border-bottom: 1px solid #2a2a2a; font-size: 15px; }
        #side-menu a:hover { color: #0af; }
        #menu-close { background: none; border: none; color: #888; font-size: 20px; float: right; cursor: pointer; }

        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
        #overlay.open { display: block; }
    </style>
</head>
<body>
    <div id="overlay" onclick="closeMenu()"></div>
    <div id="side-menu">
        <button id="menu-close" onclick="closeMenu()">✕</button>
        <a href="index.html">⚽ Football</a>
        <a href="deals.html">Deals</a>
        <a href="news.html">News</a>
        <a href="coupons.html">Coupons</a>
        <a href="help.html">Help</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="https://t.me/blck_cyb_0" target="_blank">Contact (Telegram)</a>
        <a href="mailto:hckbos77@gmail.com">Contact (Email)</a>
    </div>

    <header>
        <button id="menu-btn" onclick="openMenu()">☰</button>
        <h1>⚽ ZER0 Football</h1>
        <button id="theme-btn" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="tabs">
        <button class="tab-btn active" data-tab="scores">Scores</button>
        <button class="tab-btn" data-tab="news">News</button>
        <button class="tab-btn" data-tab="memes">Memes</button>
    </div>

    <div id="scores" class="tab-panel active"><p>Loading matches...</p></div>
    <div id="news" class="tab-panel"><p>Loading news...</p></div>
    <div id="memes" class="tab-panel"><p>Loading memes...</p></div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
            window.addEventListener('DOMContentLoaded', () => {
                document.getElementById('theme-btn').innerText = '☀️';
            });
        }
        function openMenu() {
            document.getElementById('side-menu').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('side-menu').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            };
        });

        fetch('football.json')
            .then(res => res.json())
            .then(data => {
                const el = document.getElementById('scores');
                if (!data.matches || data.matches.length === 0) {
                    el.innerHTML = '<p>No matches right now.</p>';
                    return;
                }
                el.innerHTML = data.matches.map(m => {
                    const live = ['LIVE', 'IN_PLAY', 'PAUSED'].includes(m.status);
                    const finished = m.status === 'FINISHED';
                    const scoreText = (finished || live) && m.homeScore !== null
                        ? `${m.homeScore} - ${m.awayScore}` : 'vs';
                    const statusText = live ? 'LIVE' : finished ? 'FT' : new Date(m.utcDate).toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
                    return `
                    <div class="match">
                        <div class="comp">${m.competition}</div>
                        <div class="teams">
                            <div class="team"><img src="${m.homeCrest}" onerror="this.style.display='none'"><span>${m.home}</span></div>
                            <div class="score">${scoreText}</div>
                            <div class="team" style="justify-content:flex-end"><span>${m.away}</span><img src="${m.awayCrest}" onerror="this.style.display='none'"></div>
                        </div>
                        <div class="status ${live ? 'live' : ''}">${statusText}</div>
                    </div>`;
                }).join('');
            })
            .catch(() => { document.getElementById('scores').innerHTML = '<p>Failed to load matches.</p>'; });

        fetch('football_news.json')
            .then(res => res.json())
            .then(data => {
                const el = document.getElementById('news');
                if (!data.articles || data.articles.length === 0) {
                    el.innerHTML = '<p>No news right now.</p>';
                    return;
                }
                el.innerHTML = data.articles.map(a => `
                    <div class="article">
                        <img src="${a.image || 'https://via.placeholder.com/70'}" alt="${a.title}">
                        <div class="article-info">
                            <span class="cat">${a.cat}</span>
                            <div class="title">${a.title}</div>
                            <div class="desc">${a.summary}</div>
                            ${a.link ? `<a class="read-link" href="${a.link}" target="_blank">Read more →</a>` : ''}
                        </div>
                    </div>
                `).join('');
            })
            .catch(() => { document.getElementById('news').innerHTML = '<p>Failed to load news.</p>'; });

        fetch('memes.json')
            .then(res => res.json())
            .then(data => {
                const el = document.getElementById('memes');
                if (!data.memes || data.memes.length === 0) {
                    el.innerHTML = '<p>No memes right now.</p>';
                    return;
                }
                el.innerHTML = `<div class="meme-grid">${data.memes.map(m => `
                    <div class="meme-card">
                        <a href="${m.link}" target="_blank"><img src="${m.image}" alt="${m.title}" loading="lazy"></a>
                        <div class="meme-title">${m.title}</div>
                        <div class="meme-source">${m.source}</div>
                    </div>
                `).join('')}</div>`;
            })
            .catch(() => { document.getElementById('memes').innerHTML = '<p>Failed to load memes.</p>'; });
    </script>
</body>
</html>
