    <script>
        function openMenu() {
            document.getElementById('side-menu').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('side-menu').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }
        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') !== 'dark') {
            document.body.classList.add('light');
            window.addEventListener('DOMContentLoaded', () => {
                document.getElementById('theme-btn').innerText = '☀️';
            });
        }

        const newsStartTime = Date.now();
        fetch('football_news.json')
            .then(res => res.json())
            .then(data => {
                const elapsed = Date.now() - newsStartTime;
                const remaining = Math.max(0, 700 - elapsed);
                setTimeout(() => {
                    document.getElementById('news-container').innerHTML = data.articles.map(a => `
                        <div class="article">
                            <img src="${a.image || 'https://via.placeholder.com/65'}" alt="${a.title}">
                            <div>
                                <div class="a-title">${a.title}</div>
                                <div class="a-summary">${a.summary}</div>
                                <a class="a-link" href="${a.link}" target="_blank">Read more →</a>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('news-container').classList.add('fade-in');
                    localStorage.setItem('index-last-updated', Date.now());
                }, remaining);
            })
            .catch(() => {
                document.getElementById('news-container').innerText = 'Failed to load news.';
            });
    </script>

        (function() {
            const currentPage = location.pathname.split('/').pop().replace('.html', '') || 'index';
            const pages = ['index', 'deals', 'memes', 'coupons'];
            pages.forEach(page => {
                const updated = localStorage.getItem(page + '-last-updated');
                const visited = localStorage.getItem(page + '-last-visited');
                const dot = document.querySelector('.zer0-nav-dot[data-page="' + page + '"]');
                if (dot && updated && (!visited || parseInt(updated) > parseInt(visited))) {
                    dot.classList.add('show');
                }
            });
            localStorage.setItem(currentPage + '-last-visited', Date.now());
        })();
