        .section-title { font-size: 15px; text-transform: uppercase; color: #0af; margin: 20px 0 10px; letter-spacing: 1px; }
        .match { background: #1c1c1c; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .comp { font-size: 11px; color: #888; text-transform: uppercase; }
        .teams { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: bold; margin: 6px 0; }
        .score { color: #0af; }
        .status { font-size: 11px; color: #f90; }
        .pred { font-size: 12px; color: #aaa; margin-top: 6px; font-style: italic; }

        .article { background: #1c1c1c; border-radius: 8px; padding: 15px; margin-bottom: 12px; display: flex; gap: 12px; }
        .article img { width: 65px; height: 65px; object-fit: cover; border-radius: 6px; background: #333; flex-shrink: 0; }
        .a-title { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
        .a-summary { font-size: 13px; color: #aaa; }
        .a-link { font-size: 12px; color: #0af; text-decoration: none; }

        body.light { background: #f5f5f5; color: #111; }
        body.light .article, body.light .match { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        body.light #side-menu { background: #fff; box-shadow: 2px 0 10px rgba(0,0,0,0.15); }
        body.light #side-menu a { color: #111; border-bottom-color: #eee; }
        body.light .a-title, body.light h1, body.light .teams { color: #111; }
        body.light .a-summary, body.light .pred { color: #555; }
    </style>

    <header>
        <button id="menu-btn" onclick="openMenu()">☰</button>
        <h1>⚽ ZER0 Sports</h1>
        <button id="theme-btn" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="section-title">Scores & Fixtures</div>
    <div id="scores-container">Loading scores...</div>

    <div class="section-title">Predictions</div>
    <div id="predictions-container"></div>

    <div class="section-title">Latest Football News</div>
    <div id="news-container">Loading news...</div>

    <script>
        function openMenu() {
            document.getElementById('side-menu').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('side-menu').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }
        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
            window.addEventListener('DOMContentLoaded', () => {
                document.getElementById('theme-btn').innerText = '☀️';
            });
        }

        fetch('scores.json')
            .then(res => res.json())
            .then(data => {
                const sc = document.getElementById('scores-container');
                if (!data.matches || data.matches.length === 0) {
                    sc.innerHTML = '<p>No matches in the next few days.</p>';
                } else {
                    sc.innerHTML = data.matches.map(m => `
                        <div class="match">
                            <div class="comp">${m.competition}</div>
                            <div class="teams">
                                <span>${m.home}</span>
                                <span class="score">${m.home_score ?? '-'} : ${m.away_score ?? '-'}</span>
                                <span>${m.away}</span>
                            </div>
                            <div class="status">${m.status}</div>
                        </div>
                    `).join('');
                }

                const pc = document.getElementById('predictions-container');
                if (!data.predictions || data.predictions.length === 0) {
                    pc.innerHTML = '<p style="font-size:13px;color:#888;">No predictions right now.</p>';
                } else {
                    pc.innerHTML = data.predictions.map(p => `
                        <div class="match">
                            <div class="teams" style="font-size:13px;">${p.home} vs ${p.away}</div>
                            <div class="pred">${p.prediction}</div>
                        </div>
                    `).join('');
                }
            })
            .catch(() => {
                document.getElementById('scores-container').innerText = 'Failed to load scores.';
            });

        fetch('football_news.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('news-container').innerHTML = data.articles.map(a => `
                    <div class="article">
                        <img src="${a.image || 'https://via.placeholder.com/65'}" alt="">
                        <div>
                            <div class="a-title">${a.title}</div>
                            <div class="a-summary">${a.summary}</div>
                            <a class="a-link" href="${a.link}" target="_blank">Read more →</a>
                        </div>
                    </div>
                `).join('');
            })
            .catch(() => {
                document.getElementById('news-container').innerText = 'Failed to load news.';
            });
    </script>
