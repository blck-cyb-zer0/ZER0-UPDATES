        .glitch-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fc;
            z-index: 999999;
            overflow: hidden;
        }
        .glitch-ring {
            width: 100vmax;
            height: 100vmax;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .glitch-ring::before,
        .glitch-ring::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(30, 60, 200, 0.15);
            animation: ring-pulse 8s ease-out infinite;
        }
        .glitch-ring::before {
            width: 100%;
            height: 100%;
        }
        .glitch-ring::after {
            width: 100%;
            height: 100%;
            animation-delay: 1s;
        }
        @keyframes ring-pulse {
            0% { transform: scale(0); opacity: 0.9; }
            100% { transform: scale(1); opacity: 0; }
        }
        .glitch-0 {
            font-size: 330px;
            font-weight: bold;
            font-family: monospace;
            color: #0a1a3f;
            position: absolute;
            display: inline-block;
            z-index: 2;
            animation: universe-flicker 8s steps(1, end) infinite;
        }
        .glitch-0::before,
        .glitch-0::after {
            content: 'O';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

        .glitch-0::before {
            animation: universe-shift-1 8s steps(1, end) infinite;
        }
        .glitch-0::after {
            animation: universe-shift-2 8s steps(1, end) infinite;
        }
